services:
  # ── Telegram Bot + API server (Python) ──────────────────────────
  bot:
    build: .
    container_name: stockbot
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Yangon
    volumes:
      - shop-data:/app/data
    ports:
      - "5000:5000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Web App (Telegram Mini App, served via nginx) ──────────────
  webapp:
    build: ./webapp
    container_name: stockbot-webapp
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - bot
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  shop-data:
