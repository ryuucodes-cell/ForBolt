services:
  # ── Telegram Bot (Python) ───────────────────────────────────────
  bot:
    build: .
    container_name: stockbot
    restart: unless-stopped
    env_file: .env
    environment:
      - CONTAINER_NAME=stockbot
      - TZ=Asia/Yangon
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - webapp

  # ── Web App (Telegram Mini App, served via nginx) ──────────────
  webapp:
    build: ./webapp
    container_name: stockbot-webapp
    restart: unless-stopped
    ports:
      - "8080:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
